name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27"
                  cache: true

            - name: Проверка зависимостей
              run: go mod tidy && git diff --exit-code go.mod go.sum

            - name: Вет-проверки
              run: go vet ./...

            - name: Сборка
              run: go build -o /tmp/goracing_test .
